name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Apple SDK Headers & Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libobjc-4-dev

    - name: Compile Dylib (Linux cross-compile fallback)
      run: |
        clang -dynamiclib -arch arm64 -miphoneos-version-min=12.0 -fobjc-arc hook.m -o libBundleRedirector.dylib -framework Foundation || \
        clang -shared -fPIC hook.m -o libBundleRedirector.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libBundleRedirector
        path: libBundleRedirector.dylib
