name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Dylib directly
      run: |
        echo "Checking files..."
        ls -la
        
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK Path found: $SDK_PATH"
        
        clang -dynamiclib -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=12.0 -fobjc-arc hook.m -o libBundleRedirector.dylib -framework Foundation
        
        codesign -s - --entitlements entitlements.plist libBundleRedirector.dylib
        echo "Build completed successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libBundleRedirector
        path: libBundleRedirector.dylib
