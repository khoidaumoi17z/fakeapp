name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile Dylib
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using iOS SDK path: $SDK_PATH"
        
        clang -dynamiclib -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=12.0 -fobjc-arc hook.m -o libBundleRedirector.dylib -framework Foundation
        
        codesign -s - --entitlements entitlements.plist libBundleRedirector.dylib
        echo "Build completed successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libBundleRedirector
        path: libBundleRedirector.dylib
