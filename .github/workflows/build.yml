name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Dylib
      run: |
        echo "Setting up SDK..."
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Compiling hook.m..."
        clang -dynamiclib -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0 -fobjc-arc hook.m -o libBundleRedirector.dylib -framework Foundation
        codesign -s - --entitlements entitlements.plist libBundleRedirector.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libBundleRedirector
        path: libBundleRedirector.dylib
