name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Dylib
      run: |
        echo "Starting compilation..."
        clang -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0 -fobjc-arc hook.m -o libBundleRedirector.dylib -framework Foundation
        codesign -s - --entitlements entitlements.plist libBundleRedirector.dylib
        echo "Build finished successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libBundleRedirector
        path: libBundleRedirector.dylib
